<!-- StudioControl tab mark: the same shears as src/components/Logo.tsx, on the
     rail's ground. A favicon has no surface to inherit from, so this is the one
     place the colours are stated: ink tile, lavender mark — the pairing the
     sidebar already makes. The contour is heavier than the 1.8 of the in-app
     mark because at 16px the tile eats a third of a pixel of it. -->
