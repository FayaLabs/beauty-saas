  <g transform="translate(14 14) scale(1.5)" fill="none" stroke="#B4A0E5" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8.5" cy="18.3" r="2.5"/>
    <circle cx="15.5" cy="18.3" r="2.5"/>
