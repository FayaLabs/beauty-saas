<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Assets vêm do bucket R2 (ver src/assets.ts). Aqui a URL é crua porque
         o index.html é servido antes de qualquer JS — não há helper a chamar. -->
    <!-- `logo.png`: `favicon.png` nunca subiu para o bucket e devolvia 404 —
         a aba ficava com o ícone genérico do navegador. É o mesmo desenho. -->
    <link rel="icon" type="image/png" href="https://assets.fayz.ai/glow-studio/logo.png" />
    <link rel="apple-touch-icon" href="https://assets.fayz.ai/glow-studio/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Glow Studio — agenda, clientes, comandas, estoque e financeiro para salões e clínicas de estética." />
    <meta name="theme-color" content="#161122" />
    <meta name="apple-mobile-web-app-title" content="Glow Studio" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Outfit é a face de display (títulos), DM Sans o corpo, JetBrains Mono os
         números — as três famílias do design system, num pedido só. -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Glow Studio — Gestão para Salões e Clínicas de Estética</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
