<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- O ícone da aba é local (public/mark.svg): é o mesmo espelho que o
         <Logo/> desenha, e um favicon não tem superfície de quem herdar cor, então
         é o único lugar onde o par tile-tinta é declarado. Antes vinha do bucket R2
         (`glow-studio/logo.png`, o rosto sobre o quadro malva do app antigo) — uma
         requisição de rede antes do primeiro pixel, para um desenho que já não é o
         do produto. O PNG existe só porque o iOS não aceita SVG em apple-touch-icon. -->
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="StudioControl — agenda, clientes, comandas, estoque e financeiro para salões e clínicas de estética." />
    <meta name="theme-color" content="#161122" />
    <meta name="apple-mobile-web-app-title" content="StudioControl" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Outfit é a face de display (títulos), DM Sans o corpo, JetBrains Mono os
         números — as três famílias do design system, num pedido só. -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>StudioControl — Gestão para Salões e Clínicas de Estética</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
